
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101522">
<title>Website Link Saver</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:18px 16px 100px;background:#101522;color:white;font-family:Arial,sans-serif}
header{text-align:center;padding:14px}
.logo{font-size:42px}
h1{color:#65e5bd;margin:8px}
.card{background:#1b2435;padding:16px;border-radius:16px;margin:15px 0}
input,button{width:100%;padding:12px;margin:7px 0;border:0;border-radius:10px;font-size:15px}
input{background:#293449;color:white}
button{background:#65e5bd;color:#101522;font-weight:bold;cursor:pointer}
.secondary{background:#35435c;color:white}
.danger{background:#a93f50;color:white}
#form,#menu{display:none}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.site{background:#263248;border-radius:15px;padding:14px;text-align:center;overflow-wrap:anywhere;user-select:none;-webkit-user-select:none}
.siteIcon{width:62px;height:62px;border-radius:18px;background:#65e5bd;color:#101522;display:flex;align-items:center;justify-content:center;font-size:30px;margin:0 auto 10px}
.siteName{font-weight:bold}
.siteUrl{font-size:12px;color:#bdc6d8;overflow-wrap:anywhere;margin:8px 0}
.site button{font-size:13px;padding:10px}
.small{font-size:12px;color:#bdc6d8}
#menu{position:fixed;z-index:5;bottom:95px;left:18px;right:18px;background:#1b2435;padding:16px;border-radius:16px;box-shadow:0 5px 25px #0009}
#add{position:fixed;right:22px;bottom:22px;width:64px;height:64px;border-radius:50%;font-size:35px;padding:0;box-shadow:0 5px 20px #0008}
</style>
</head>
<body>

<header>
  <div class="logo">🌐</div>
  <h1>Website Link Saver</h1>
  <p class="small">Save your favourite website links</p>
</header>

<section class="card" id="form">
  <h2 id="formTitle">Add Website</h2>
  <input id="name" placeholder="Website name (e.g. YouTube)">
  <input id="url" placeholder="Website URL (https://example.com)">
  <button id="save">Save Website</button>
  <button class="secondary" id="cancel">Cancel</button>
</section>

<section class="card">
  <input id="search" placeholder="🔍 Search websites">
  <h2>My Websites</h2>
  <div class="grid" id="grid"></div>
  <p class="small">Website icon ko long-press karke Edit ya Delete chuno.</p>
</section>

<section id="menu">
  <h3 id="menuTitle">Website Options</h3>
  <button id="open">🌐 Open Website</button>
  <button id="edit">✏️ Edit Name / URL</button>
  <button class="danger" id="delete">🗑 Delete Website</button>
  <button class="secondary" id="closeMenu">Cancel</button>
</section>

<button id="add" aria-label="Add website">+</button>

<script>
"use strict";

const KEY = "website_link_saver_v1";
const $ = id => document.getElementById(id);
let editingId = null;
let selectedId = null;
let pressTimer = null;
let longPressed = false;

function getSites(){
  try {
    const data = JSON.parse(localStorage.getItem(KEY) || "[]");
    return Array.isArray(data) ? data : [];
  } catch(e) {
    return [];
  }
}

function saveSites(sites){
  try {
    localStorage.setItem(KEY, JSON.stringify(sites));
    return true;
  } catch(e) {
    alert("Storage full hai. Kuch links delete karke try karo.");
    return false;
  }
}

function newId(){
  return Date.now().toString(36) + Math.random().toString(36).slice(2);
}

function showForm(site = null){
  editingId = site ? site.id : null;
  $("formTitle").textContent = site ? "Edit Website" : "Add Website";
  $("name").value = site ? site.name : "";
  $("url").value = site ? site.url : "";
  $("form").style.display = "block";
  $("menu").style.display = "none";
  $("form").scrollIntoView({behavior:"smooth",block:"start"});
}

$("add").onclick = () => showForm();

$("cancel").onclick = () => {
  $("form").style.display = "none";
  editingId = null;
};

$("save").onclick = () => {
  const name = $("name").value.trim();
  let url = $("url").value.trim();

  if(!name || !url){
    alert("Website ka naam aur URL dono bharo.");
    return;
  }

  if(!/^https?:\/\//i.test(url)) url = "https://" + url;

  try {
    const parsed = new URL(url);
    if(!["https:","http:"].includes(parsed.protocol)) throw Error();
    url = parsed.href;
  } catch(e) {
    alert("Valid website URL daalo.");
    return;
  }

  const sites = getSites();

  if(editingId){
    const i = sites.findIndex(s => s.id === editingId);
    if(i < 0) return;
    sites[i] = {...sites[i],name,url};
  } else {
    sites.unshift({id:newId(),name,url});
  }

  if(saveSites(sites)){
    $("form").style.display = "none";
    editingId = null;
    render();
  }
};

function showMenu(id){
  const site = getSites().find(s => s.id === id);
  if(!site) return;
  selectedId = id;
  $("menuTitle").textContent = site.name;
  $("menu").style.display = "block";
}

$("closeMenu").onclick = () => {
  $("menu").style.display = "none";
};

$("open").onclick = () => {
  const site = getSites().find(s => s.id === selectedId);
  if(site) window.open(site.url,"_blank","noopener,noreferrer");
  $("menu").style.display = "none";
};

$("edit").onclick = () => {
  const site = getSites().find(s => s.id === selectedId);
  if(site) showForm(site);
};

$("delete").onclick = () => {
  if(!confirm("Is website ko delete karna hai?")) return;
  if(saveSites(getSites().filter(s => s.id !== selectedId))){
    $("menu").style.display = "none";
    render();
  }
};

function render(){
  const grid = $("grid");
  grid.replaceChildren();
  const q = $("search").value.trim().toLowerCase();

  const sites = getSites().filter(s =>
    s.name.toLowerCase().includes(q) ||
    s.url.toLowerCase().includes(q)
  );

  if(!sites.length){
    const p = document.createElement("p");
    p.className = "small";
    p.textContent = "Koi website saved nahi hai. + button dabao.";
    p.style.gridColumn = "1 / -1";
    grid.appendChild(p);
    return;
  }

  sites.forEach(site => {
    const box = document.createElement("div");
    box.className = "site";
    box.tabIndex = 0;

    const icon = document.createElement("div");
    icon.className = "siteIcon";
    icon.textContent = "🌐";

    const title = document.createElement("div");
    title.className = "siteName";
    title.textContent = site.name;

    const url = document.createElement("div");
    url.className = "siteUrl";
    url.textContent = site.url;

    const openBtn = document.createElement("button");
    openBtn.textContent = "Open Website";
    openBtn.onclick = () =>
      window.open(site.url,"_blank","noopener,noreferrer");

    box.append(icon,title,url,openBtn);

    box.addEventListener("contextmenu", e => {
      e.preventDefault();
      showMenu(site.id);
    });

    box.addEventListener("pointerdown", () => {
      longPressed = false;
      clearTimeout(pressTimer);
      pressTimer = setTimeout(() => {
        longPressed = true;
        showMenu(site.id);
      },650);
    });

    ["pointerup","pointerleave","pointercancel"].forEach(event => {
      box.addEventListener(event, () => clearTimeout(pressTimer));
    });

    box.addEventListener("click", e => {
      if(longPressed){
        e.preventDefault();
        e.stopPropagation();
        longPressed = false;
      }
    });

    box.addEventListener("keydown", e => {
      if(e.key === "Enter") showMenu(site.id);
    });

    grid.appendChild(box);
  });
}

$("search").addEventListener("input",render);
render();
</script>
</body>
</html>
