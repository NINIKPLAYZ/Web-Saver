
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#101522">
<title>Web Saver</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101522;color:white;font-family:Arial,sans-serif;min-height:100vh;padding:18px 16px 100px}
header{display:flex;align-items:center;gap:12px;margin:12px 0 22px}
.brand{width:48px;height:48px;border-radius:15px;background:#65e5bd;color:#101522;display:grid;place-items:center;font-size:27px}
h1{font-size:24px;margin:0}
.sub{color:#aebbd0;font-size:13px;margin-top:5px}
.search{width:100%;padding:14px;border:1px solid #303b50;border-radius:14px;background:#1b2435;color:white;font-size:16px;outline:none}
h2{font-size:17px;margin:25px 0 18px}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:22px 8px}
.app{text-align:center;min-width:0;user-select:none;-webkit-user-select:none;touch-action:pan-y}
.appicon{width:min(64px,17vw);height:min(64px,17vw);margin:auto;border-radius:20px;background:#27354a;display:grid;place-items:center;font-size:30px;overflow:hidden;border:1px solid #ffffff12}
.appicon img{width:100%;height:100%;object-fit:cover}
.appname{font-size:12px;margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{grid-column:1/-1;text-align:center;color:#aebbd0;padding:30px 5px;line-height:1.6}
.fab{position:fixed;right:22px;bottom:25px;width:62px;height:62px;border-radius:50%;border:0;background:#65e5bd;color:#101522;font-size:34px;box-shadow:0 6px 25px #0008}
.overlay{display:none;position:fixed;inset:0;background:#0009;z-index:5;align-items:flex-end}
.panel{background:#1b2435;padding:22px;border-radius:22px 22px 0 0;width:100%;max-height:85vh;overflow:auto}
input,button{font:inherit}
.field{display:block;width:100%;padding:13px;margin:10px 0;background:#293449;color:white;border:1px solid #3a4960;border-radius:10px}
.action{display:block;width:100%;padding:13px;border:0;border-radius:10px;margin:9px 0;background:#65e5bd;color:#101522;font-weight:bold}
.secondary{background:#35435c;color:white}
.danger{background:#a93f50;color:white}
.note{font-size:12px;color:#aebbd0;line-height:1.5}
</style>
</head>
<body>
<header>
  <div class="brand">🌐</div>
  <div>
    <h1>Web Saver</h1>
    <div class="sub">Your favourite websites in one place</div>
  </div>
</header>

<input class="search" id="search" placeholder="🔍 Search apps and websites">

<h2>My Apps</h2>
<div class="grid" id="grid"></div>

<button class="fab" id="add" aria-label="Add website">+</button>

<div class="overlay" id="overlay">
  <div class="panel">
    <h2 id="panelTitle" style="margin-top:0">Add Website</h2>
    <input class="field" id="siteName" placeholder="Website name (e.g. YouTube)">
    <input class="field" id="siteUrl" placeholder="Website URL (https://example.com)">
    <input class="field" id="siteIcon" placeholder="Icon emoji (e.g. ▶️)" maxlength="8">
    <button class="action" id="save">Save Website</button>
    <button class="action secondary" id="cancel">Cancel</button>
    <p class="note">Tip: Website ka naam, link aur apni pasand ka emoji icon add karo.</p>
  </div>
</div>

<div class="overlay" id="options">
  <div class="panel">
    <h2 id="optionName" style="margin-top:0">Website Options</h2>
    <button class="action" id="open">Open Website</button>
    <button class="action" id="edit">✏️ Edit Name / URL / Icon</button>
    <button class="action danger" id="remove">Delete Website</button>
    <button class="action secondary" id="closeOptions">Cancel</button>
  </div>
</div>

<script>
"use strict";
const KEY = "web_saver_launcher_v1";
const $ = id => document.getElementById(id);
let editing = null, selected = null, pressTimer = null, longPressed = false;

function load(){
  try {
    const a = JSON.parse(localStorage.getItem(KEY) || "[]");
    return Array.isArray(a) ? a : [];
  } catch(e) { return []; }
}
function persist(a){
  try {
    localStorage.setItem(KEY, JSON.stringify(a));
    return true;
  } catch(e) {
    alert("Browser storage full hai.");
    return false;
  }
}
function uid(){
  return Date.now().toString(36) + Math.random().toString(36).slice(2);
}
function showForm(site=null){
  editing = site ? site.id : null;
  $("panelTitle").textContent = site ? "Edit Website" : "Add Website";
  $("siteName").value = site ? site.name : "";
  $("siteUrl").value = site ? site.url : "";
  $("siteIcon").value = site ? site.icon : "🌐";
  $("options").style.display = "none";
  $("overlay").style.display = "flex";
}
function hideForm(){
  $("overlay").style.display = "none";
  editing = null;
}
$("add").onclick = () => showForm();
$("cancel").onclick = hideForm;
$("overlay").addEventListener("click",e=>{
  if(e.target === $("overlay")) hideForm();
});

$("save").onclick = () => {
  const name = $("siteName").value.trim();
  let url = $("siteUrl").value.trim();
  const icon = $("siteIcon").value.trim() || "🌐";

  if(!name || !url){
    alert("Website name aur URL dono bharo.");
    return;
  }
  if(!/^https?:\/\//i.test(url)) url = "https://" + url;

  try {
    const u = new URL(url);
    if(!["http:","https:"].includes(u.protocol)) throw Error();
    url = u.href;
  } catch(e) {
    alert("Valid website URL daalo.");
    return;
  }

  const sites = load();
  if(editing){
    const i = sites.findIndex(s=>s.id===editing);
    if(i<0) return;
    sites[i] = {...sites[i],name,url,icon};
  } else {
    sites.unshift({id:uid(),name,url,icon});
  }
  if(persist(sites)){
    hideForm();
    render();
  }
};

function showOptions(id){
  const site = load().find(s=>s.id===id);
  if(!site) return;
  selected = id;
  $("optionName").textContent = site.name;
  $("options").style.display = "flex";
}
$("closeOptions").onclick = ()=>$("options").style.display="none";
$("options").addEventListener("click",e=>{
  if(e.target === $("options")) $("options").style.display="none";
});
$("open").onclick = ()=>{
  const s=load().find(x=>x.id===selected);
  if(s) window.open(s.url,"_blank","noopener,noreferrer");
  $("options").style.display="none";
};
$("edit").onclick = ()=>{
  const s=load().find(x=>x.id===selected);
  if(s) showForm(s);
};
$("remove").onclick = ()=>{
  if(!confirm("Website delete karni hai?")) return;
  if(persist(load().filter(s=>s.id!==selected))) render();
  $("options").style.display="none";
};

function render(){
  const grid=$("grid");
  grid.replaceChildren();
  const q=$("search").value.toLowerCase().trim();
  const sites=load().filter(s=>
    s.name.toLowerCase().includes(q)||s.url.toLowerCase().includes(q)
  );
  if(!sites.length){
    const d=document.createElement("div");
    d.className="empty";
    d.textContent="Abhi koi website nahi hai. + dabao aur apni pehli website add karo.";
    grid.appendChild(d);
    return;
  }
  sites.forEach(site=>{
    const box=document.createElement("div");
    box.className="app";
    box.tabIndex=0;
    box.setAttribute("aria-label",site.name+"; long press for options");

    const icon=document.createElement("div");
    icon.className="appicon";
    icon.textContent=site.icon||"🌐";
    const name=document.createElement("div");
    name.className="appname";
    name.textContent=site.name;
    box.append(icon,name);

    box.addEventListener("pointerdown",()=>{
      longPressed=false;
      clearTimeout(pressTimer);
      pressTimer=setTimeout(()=>{
        longPressed=true;
        showOptions(site.id);
      },600);
    });
    ["pointerup","pointerleave","pointercancel"].forEach(ev=>
      box.addEventListener(ev,()=>clearTimeout(pressTimer))
    );
    box.addEventListener("contextmenu",e=>{
      e.preventDefault();
      showOptions(site.id);
    });
    box.addEventListener("click",e=>{
      if(longPressed){
        e.preventDefault();
        e.stopPropagation();
        longPressed=false;
        return;
      }
      window.open(site.url,"_blank","noopener,noreferrer");
    });
    box.addEventListener("keydown",e=>{
      if(e.key==="Enter") window.open(site.url,"_blank","noopener,noreferrer");
      if(e.key==="ContextMenu") showOptions(site.id);
    });
    grid.appendChild(box);
  });
}
$("search").addEventListener("input",render);
render();
</script>
</body>
</html>
